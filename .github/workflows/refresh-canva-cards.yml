name: Refresh Canva Lunch and Dinner Cards

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-canva-cards.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Refresh current Canva preview URLs safely
        env:
          LUNCH_DESIGN_ID: DAHTuu8X2yM
          LUNCH_VIEW_URL: https://www.canva.com/d/D5xcebMBjAMcudw
          DINNER_DESIGN_ID: DAHTvlreZt0
          DINNER_VIEW_URL: https://www.canva.com/d/iDVsgwbFfGkaH1j
        run: |
          python3 - <<'PY'
          import html, os, re, shutil, subprocess
          from pathlib import Path

          def curl_page(url):
              try:
                  return subprocess.check_output([
                      'curl','-L','--fail','--silent','--show-error',
                      '-A','Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
                      '-H','Accept:text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                      '-H','Accept-Language:en-AU,en;q=0.9',url
                  ], text=True, timeout=35)
              except Exception as exc:
                  print(f'curl blocked: {exc}')
                  return None

          def browser_page(url):
              chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium') or shutil.which('chromium-browser')
              if not chrome:
                  return None
              try:
                  return subprocess.check_output([
                      chrome,'--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage',
                      '--disable-blink-features=AutomationControlled',
                      '--user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
                      '--virtual-time-budget=8000','--dump-dom',url
                  ], text=True, timeout=45, stderr=subprocess.STDOUT)
              except Exception as exc:
                  print(f'Browser fetch failed: {exc}')
                  return None

          def valid_preview(candidate, design_id):
              if not candidate or not candidate.startswith('https://'):
                  return False
              candidate = html.unescape(candidate)
              low = candidate.lower()
              if 'static.canva.com' in low or 'fb_cover' in low or 'canva-logo' in low:
                  return False
              return design_id in candidate and (
                  'media.canva.com/v2/document-image/' in candidate or
                  'document-export.canva.com' in candidate
              )

          def extract_preview(page, design_id):
              if not page:
                  return None
              candidates = re.findall(r'https://[^"\'<> ]+', page)
              for raw in candidates:
                  candidate = html.unescape(raw).replace('&amp;', '&')
                  if valid_preview(candidate, design_id):
                      return candidate
              return None

          def preview_from_page(url, design_id):
              preview = extract_preview(curl_page(url), design_id)
              if preview:
                  return preview
              print(f'{design_id}: trying browser fallback')
              return extract_preview(browser_page(url), design_id)

          def current_value(text, const_name):
              m = re.search(rf"const {const_name}='([^']*)';", text)
              return m.group(1) if m else ''

          path = Path('script.js')
          text = path.read_text()
          configs = [
              ('TODAY_LUNCH_IMAGE', os.environ['LUNCH_DESIGN_ID'], os.environ['LUNCH_VIEW_URL']),
              ('LATEST_SPECIAL_IMAGE', os.environ['DINNER_DESIGN_ID'], os.environ['DINNER_VIEW_URL']),
          ]

          changed = False
          for const_name, design_id, view_url in configs:
              old_url = current_value(text, const_name)

              # Never overwrite a card that has intentionally moved to a newer design.
              if old_url and 'canva.com' in old_url.lower() and design_id not in old_url:
                  print(f'{const_name}: current website image uses a different design; keeping it unchanged')
                  continue

              new_url = preview_from_page(view_url, design_id)
              if not new_url:
                  print(f'{const_name}: no verified fresh preview; keeping current correct image')
                  continue

              pattern = rf"const {const_name}='[^']*';"
              replacement = f"const {const_name}='{new_url}';"
              new_text, count = re.subn(pattern, replacement, text, count=1)
              if count == 1 and new_text != text:
                  text = new_text
                  changed = True
                  print(f'{const_name}: refreshed verified Canva preview')

          if changed:
              path.write_text(text)
          PY

      - name: Commit refreshed image URLs
        run: |
          if git diff --quiet -- script.js; then
            echo 'No verified Canva URL change detected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git commit -m 'Refresh verified Canva lunch and dinner previews'
          git push
