<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src https://script.google.com https://script.googleusercontent.com; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https://52south.au data:; base-uri 'none'; form-action 'none'">
  <title>Member Welcome Wheel | 52 South</title>
  <link rel="icon" type="image/png" href="/assets/52-south-logo.png">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080706;color:#f8f3e7;font-family:Arial,sans-serif}body{min-height:100vh;min-height:100svh}.top{height:64px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #382d1b;background:#0d0b08}.top img{width:42px;height:42px;border-radius:50%;margin-right:12px}.top strong{font-size:.78rem;letter-spacing:.15em;color:#e4c272}.wheel-frame{display:block;width:100%;height:calc(100vh - 64px);height:calc(100svh - 64px);border:0;background:#080706}.message{max-width:620px;margin:14vh auto 0;padding:30px;text-align:center}.message h1{font:400 3rem Georgia,serif;color:#e4c272}.message a{color:#f2d989}
  </style>
</head>
<body>
  <header class="top"><img src="/assets/52-south-logo.png" alt=""><strong>52 SOUTH · MEMBER REWARDS</strong></header>
  <main id="wheel-host"><div class="message"><h1>Opening your wheel…</h1><p>Your private member access is being checked securely.</p></div></main>
  <script>
    (()=>{
      const token=decodeURIComponent(location.hash.slice(1));
      const host=document.getElementById('wheel-host');
      if(!/^[a-f0-9]{64}$/i.test(token)){
        host.innerHTML='<div class="message"><h1>Private access required</h1><p>Verify your membership on the 52 South Rewards page to open a new wheel.</p><p><a href="/loyalty/">Return to 52 South Rewards</a></p></div>';
        return;
      }
      const frame=document.createElement('iframe');
      frame.className='wheel-frame';frame.title='52 South member Welcome Wheel';
      frame.referrerPolicy='no-referrer';frame.credentialless=true;frame.setAttribute('credentialless','');
      frame.setAttribute('sandbox','allow-forms allow-scripts allow-same-origin allow-popups');
      frame.src='https://script.google.com/macros/s/AKfycbymxZXbLhodJ1XmhGSfgvXKavn_S_ANsou_E3l2t2dxdguPboGiJidkAUo_Wke9Cys6sQ/exec?action=spin&token='+encodeURIComponent(token);
      host.replaceChildren(frame);
    })();
  </script>
</body>
</html>
